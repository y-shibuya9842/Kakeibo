<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#20a39e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="家計簿" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
  <title>家計簿</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">家計簿</h1>
        <p id="pageSubtitle">シンプルに、毎月の支出を把握</p>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button class="nav-item active" data-view="home" aria-label="ホーム">
        <span class="nav-icon">⌂</span><span>ホーム</span>
      </button>
      <button class="nav-item" data-view="history" aria-label="履歴">
        <span class="nav-icon">▤</span><span>履歴</span>
      </button>
      <button class="nav-item" data-view="graph" aria-label="グラフ">
        <span class="nav-icon">▥</span><span>グラフ</span>
      </button>
      <button class="nav-item" data-view="settings" aria-label="設定">
        <span class="nav-icon">⚙</span><span>設定</span>
      </button>
    </nav>
  </div>

  <input id="restoreFile" type="file" accept="application/json" hidden />
  <script src="app.js" defer></script>
</body>
</html>
